[workspace]
resolver = "2"
members = [
    "crates/paintbox_core",
    "app/packages_tools/paint_bridge/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "webp"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ab_glyph = "0.2"
ab_glyph_rasterizer = "0.1"
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "apple-layout", "variable-fonts", "glyph-names"] }

[profile.dev]
# Pixel loops are unusable fully unoptimised; tests run on whole images.
opt-level = 2

[profile.release]
lto = "thin"
